name: habita
description: "Habita — a property discovery and marketplace platform for Uganda. Find it. Own it. Live it."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1" 

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Make sure this is at the very bottom, aligned to the left with NO spaces before it
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "habita.png"